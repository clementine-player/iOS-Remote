name: ClementineRemote
options:
  bundleIdPrefix: org.clementine-player
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  ClementineKit:
    path: Packages/ClementineKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  ClementineRemote:
    type: application
    productName: Clementine Remote
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: ClementineKit
      - package: ClementineKit
        product: ClementineWatch
      - target: ClementineWidget
      # Embedded, as the watch only talks to an app that has it, but a draft: scripts/archive.sh
      # takes it out again, so TestFlight builds and releases leave it out.
      - target: ClementineRemoteWatch
    entitlements:
      path: App/ClementineRemote.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Clementine Remote
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clementine Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        UILaunchScreen:
          UIColorName: Surface
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Clementine Remote finds and talks to Clementine on your local network.
        NSBonjourServices:
          - _clementine._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # Remote streaming: Clementine's music keeps playing in the background, fetched over plain
        # HTTP from Clementine's media server on the local network.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
  ClementineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: ClementineKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/ClementineWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Clementine Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        PRODUCT_NAME: ClementineWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SKIP_INSTALL: YES
  ClementineRemoteWatch:
    type: application
    platform: watchOS
    sources:
      # With its own assets (WatchApp/Assets.xcassets): the colours it uses, in their dark values.
      - path: WatchApp
      - path: App/Theme/Theme.swift
    dependencies:
      - package: ClementineKit
        product: ClementineWatch
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Clementine Remote
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_BUNDLE_ID)
        PRODUCT_NAME: ClementineRemoteWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SKIP_INSTALL: YES
  ClementineRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ClementineRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClementineRemoteWatch:
    build:
      targets:
        ClementineRemoteWatch: all
  ClementineRemote:
    build:
      targets:
        ClementineRemote: all
    test:
      targets:
        - ClementineRemoteUITests
        - package: ClementineKit/ClementineKitTests
