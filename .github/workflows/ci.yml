name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ClementineKit's tests, on macOS: quick, and no simulator needed.
  package:
    runs-on: xcode-27
    env:
      # Xcode 27.1, for the iOS 27.1 SDK (iPhone Duo's fold): the xcode-27 image has it, but
      # defaults to 27.0.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test ClementineKit
        working-directory: Packages/ClementineKit
        run: swift test

  # The app built for the simulator, with ClementineKit's and the UI tests.
  app:
    runs-on: xcode-27
    env:
      # Xcode 27.1, for the iOS 27.1 SDK (iPhone Duo's fold): the xcode-27 image has it, but
      # defaults to 27.0.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check the Xcode project matches project.yml
        # The project is generated, but committed: a change to project.yml, or a source file added
        # to a target's folder, needs the regenerated project committed with it.
        run: |
          xcodegen generate --quiet
          if [ -n "$(git status --porcelain -- ClementineRemote.xcodeproj)" ]; then
            git status --short -- ClementineRemote.xcodeproj
            git diff -- ClementineRemote.xcodeproj
            echo "::error::ClementineRemote.xcodeproj is out of date. Run xcodegen generate and commit the result."
            exit 1
          fi
      - name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS-2" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          ')
          echo "Using simulator $id"
          echo "DESTINATION=id=$id" >> "$GITHUB_ENV"
          # Booted and ready before the tests: booting can take minutes on a runner, and the UI
          # tests' first launch of the app times out after one while it's still booting.
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
      - name: Build and test
        # CI has no signing account: build for the simulator without a team. xcodebuild exits with
        # 70 when it finds no simulator to run on: once, it found none at all, although the one
        # picked had booted, so it tries once more then.
        run: |
          status=0
          scripts/build.sh test DEVELOPMENT_TEAM= || status=$?
          if [ "$status" = 70 ]; then
            echo "::warning::xcodebuild found no simulator; trying again"
            xcrun simctl list devices booted
            scripts/build.sh test DEVELOPMENT_TEAM=
          else
            exit "$status"
          fi
      - name: Check the String Catalog has the app's strings
        # The catalog is what Transifex gets to translate: a string added to the app needs the
        # catalog the build updated committed with it.
        run: |
          if [ -n "$(git status --porcelain -- App/Resources/Localizable.xcstrings)" ]; then
            git diff --stat -- App/Resources/Localizable.xcstrings
            echo "::error::App/Resources/Localizable.xcstrings is out of date. Run scripts/build.sh and commit the catalog it updated, or take it from this run's String Catalog artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: String Catalog
          path: App/Resources/Localizable.xcstrings

  # A single check for branch protection to require. It runs even when a job
  # it needs fails, because GitHub treats a skipped required check as passing.
  ci:
    name: CI
    needs: [package, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the other jobs passed
        run: |
          echo "package: ${{ needs.package.result }}"
          echo "app: ${{ needs.app.result }}"
          test "${{ needs.package.result }}" = success
          test "${{ needs.app.result }}" = success
