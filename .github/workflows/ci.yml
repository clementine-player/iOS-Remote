name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ClementineKit's tests, on macOS: quick, and no simulator needed.
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode
        run: xcodebuild -version
      - name: Test ClementineKit
        working-directory: Packages/ClementineKit
        run: swift test

  # The app built for the simulator, with ClementineKit's and the UI tests.
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS-2" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          ')
          echo "Using simulator $id"
          echo "DESTINATION=id=$id" >> "$GITHUB_ENV"
          # Booted and ready before the tests: booting can take minutes on a runner, and the UI
          # tests' first launch of the app times out after one while it's still booting.
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
      - name: Build and test
        # CI has no signing account: build for the simulator without a team.
        run: scripts/build.sh test DEVELOPMENT_TEAM=

  # Whether the screenshots need taking again: what they show, or what takes them, changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      screenshots: ${{ steps.filter.outputs.screenshots }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            screenshots:
              - .github/workflows/screenshots.yml
              - App/**
              - Shared/**
              - Packages/ClementineKit/Sources/**
              - UITests/Screenshots.swift
              - project.yml
              - clementine-it/**
              - scripts/build.sh
              - scripts/post_screenshots.sh

  screenshots:
    needs: changes
    if: needs.changes.outputs.screenshots == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write # for the screenshots comment
    uses: ./.github/workflows/screenshots.yml
    secrets: inherit

  # A single check for branch protection to require. It runs even when a job
  # it needs fails, because GitHub treats a skipped required check as passing.
  # The screenshots may be skipped, when nothing they depend on changed.
  ci:
    name: CI
    needs: [package, app, changes, screenshots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the other jobs passed
        run: |
          echo "package: ${{ needs.package.result }}"
          echo "app: ${{ needs.app.result }}"
          echo "changes: ${{ needs.changes.result }}"
          echo "screenshots: ${{ needs.screenshots.result }}"
          test "${{ needs.package.result }}" = success
          test "${{ needs.app.result }}" = success
          test "${{ needs.changes.result }}" = success
          case "${{ needs.screenshots.result }}" in success|skipped) ;; *) exit 1 ;; esac
