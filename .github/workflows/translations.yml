# Keeps the app's translations in step with Transifex, as Clementine and the Android remote do:
#   - push: when the String Catalog changes on main, sends it to Transifex for the translators
#   - pull: every night, brings the translations back into the catalog
#     (scripts/merge-transifex-translations.py), and commits them to main when they changed.
#     Each such commit has a release note, so new translations make the next release.
#
# The Transifex resource is in .tx/config. Needs two secrets (see RELEASING.md): TX_TOKEN, a
# Transifex API token, and TX_KEY, the private half of a deploy key with write access, which
# pushes the translations to main. Until they're set, each job is skipped with a notice.
#
# Run it by hand (Actions → translations → Run workflow) to pull now. With "Push translations"
# ticked, it first sends the catalog's translations to Transifex: once, to fill a new Transifex
# resource with the translations made before it.
name: translations
on:
  push:
    branches: [main]
    paths:
      - .tx/config
      - .github/workflows/translations.yml
      - App/Resources/Localizable.xcstrings
  schedule:
    - cron: "37 2 * * *" # Every night, 02:37 UTC
  workflow_dispatch:
    inputs:
      push_translations:
        description: "Push translations: send the catalog's translations to Transifex first"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TX_VERSION: 1.6.17

# Every tx command is --silent: otherwise the client cuts each line, errors included, to the
# terminal's width, 80 columns in CI, which hides why Transifex refused a file.

jobs:
  push:
    name: Push strings to Transifex
    if: github.repository == 'clementine-player/iOS-Remote' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the Transifex client
        if: env.TX_TOKEN != ''
        run: |
          mkdir -p "$RUNNER_TEMP/tx"
          curl -fsSL "https://github.com/transifex/cli/releases/download/v$TX_VERSION/tx-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tx" tx
          echo "$RUNNER_TEMP/tx" >> "$GITHUB_PATH"
      - name: Push the English strings
        if: env.TX_TOKEN != ''
        run: tx push --source --silent
      # The catalog has every language, and Transifex takes them all from a file uploaded as
      # any one of them.
      - name: Push the translations
        if: env.TX_TOKEN != '' && inputs.push_translations
        run: |
          mkdir -p build/transifex
          cp App/Resources/Localizable.xcstrings build/transifex/de.xcstrings
          tx push --translation --languages de --silent
      - name: No Transifex token
        if: env.TX_TOKEN == ''
        run: echo "::notice::The TX_TOKEN secret isn't set, so nothing was sent to Transifex. See RELEASING.md."

  pull:
    name: Pull translations from Transifex
    needs: push
    # After the push when there is one (run by hand), but on its own every night.
    if: >-
      always() && github.repository == 'clementine-player/iOS-Remote'
      && github.event_name != 'push' && needs.push.result != 'failure'
    runs-on: ubuntu-latest
    env:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}
      HAS_TX_KEY: ${{ secrets.TX_KEY != '' }}
    steps:
      - name: No Transifex token or deploy key
        if: env.TX_TOKEN == '' || env.HAS_TX_KEY != 'true'
        run: echo "::notice::The TX_TOKEN or TX_KEY secret isn't set, so no translations were pulled. See RELEASING.md."
      # Checked out with the deploy key, so the push below runs the other workflows on the new
      # commit (ci.yml, testflight.yml), as a push with the workflow's own token wouldn't.
      - uses: actions/checkout@v5
        if: env.TX_TOKEN != '' && env.HAS_TX_KEY == 'true'
        with:
          ref: main
          ssh-key: ${{ secrets.TX_KEY }}
      - name: Install the Transifex client
        if: env.TX_TOKEN != '' && env.HAS_TX_KEY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tx"
          curl -fsSL "https://github.com/transifex/cli/releases/download/v$TX_VERSION/tx-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tx" tx
          echo "$RUNNER_TEMP/tx" >> "$GITHUB_PATH"
      # Only translated strings: the app shows English for the rest by itself.
      - name: Pull the translations
        id: pull
        if: env.TX_TOKEN != '' && env.HAS_TX_KEY == 'true'
        run: |
          # Transifex's onlytranslated mode can leave reviewed translations out, as it does for the
          # Android remote's files, and onlyreviewed leaves out those not reviewed yet: both are
          # pulled, and the merge takes the translations from each.
          # (A mode with nothing to give may write no files at all.)
          shopt -s nullglob
          mkdir -p build/transifex
          tx pull --all --force --mode onlyreviewed --silent
          mv build/transifex build/transifex-reviewed
          mkdir -p build/transifex
          tx pull --all --force --mode onlytranslated --silent
          scripts/merge-transifex-translations.py build/transifex-reviewed/*.xcstrings build/transifex/*.xcstrings
          if git diff --quiet -- App/Resources/Localizable.xcstrings; then
            echo "Translations are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.pull.outputs.changed
        run: |
          git add App/Resources/Localizable.xcstrings
          git -c user.name='Clementine Buildbot' -c user.email='buildbot@clementine-player.org' \
            commit -m 'Automatic merge of translations from Transifex' \
            -m 'Release-note: Updated translations, thanks to our translators on Transifex.'
          git push origin HEAD:main
