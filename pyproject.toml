# The Python scripts in scripts/, which the workflows run: uv run scripts/<script>.py
# CI checks them with: uv run ruff check, uv run ruff format --check, uv run ty check,
# uv run pytest
[project]
name = "clementine-remote-ios-scripts"
version = "0.1.0"
description = "Scripts for translating and releasing Clementine Remote for iOS"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    # transifex.py: Transifex's API.
    "requests>=2.32",
]

[tool.uv]
# Scripts, not a package to build.
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned, so CI and local runs agree on what counts as an error.
    "ruff==0.16.9",
    "ty==0.0.84",
    "types-requests>=2.32",
]

[tool.ruff]
target-version = "py311"
line-length = 88
# The scripts are first-party modules to their tests.
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "ANN",          # every function fully annotated
    "DTZ",          # naive datetimes
    "PYI",          # typing conventions
    "PLC0415",      # imports at the top of the file, not inside functions
    "RUF",
]

[tool.ruff.lint.flake8-annotations]
# Not even *args: Any and **kwargs: Any without saying so.
allow-star-arg-any = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
# The tests import the scripts they test as modules.
pythonpath = ["scripts"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.terminal]
error-on-warning = true
